name: Blog publication browser validation
on:
  pull_request:
jobs:
  blog-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Use runner Chrome
        run: |
          google-chrome --version
          cat > .blog-playwright.config.ts <<'EOF'
          import config from './playwright.config';
          export default { ...config, use: { ...config.use, video: 'off', launchOptions: { executablePath: '/usr/bin/google-chrome', args: ['--no-sandbox'] } } };
          EOF
      - run: npx playwright test tests/e2e/out-of-scope.spec.ts --config=.blog-playwright.config.ts
