name: ANTONIOMDM OS · manual browser E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        id: godot-cache
        with:
          path: |
            /tmp/godot
            ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-4.7.2-linux-web-v1
      - name: Install Godot 4.7.2 and web export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          curl --fail --location --retry 3 -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -j /tmp/templates.tpz 'templates/web_nothreads_release.zip' 'templates/version.txt' -d "$HOME/.local/share/godot/export_templates/4.7.2.stable"
      - run: echo "GODOT_BIN=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      # TEMPORARY: Real Playwright/Godot browser E2E pass in the supported local
      # environment but remain unstable in GitHub Actions. They are enforced by
      # local pre-push verification while CI timing/environment divergence is
      # investigated. Do not remove the suite; restore it as required CI once resolved.
      # TEMPORAL: Los E2E reales de Playwright/Godot pasan localmente, pero son
      # inestables en GitHub Actions. Se exigen antes del push mientras se
      # investiga la divergencia; no elimines la suite y restáurala en CI al resolverla.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
