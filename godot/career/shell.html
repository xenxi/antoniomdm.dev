<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AntoñiOS · Pixel World</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b101c}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}canvas:focus-visible{outline:2px solid #b6f2d3;outline-offset:-3px}</style>
$GODOT_HEAD_INCLUDE</head><body><canvas id="canvas" tabindex="0"></canvas>
<script src="$GODOT_URL"></script><script>
const channel = 'antonios:godot:v1';
const en = new URLSearchParams(location.search).get('lang') === 'en';
document.documentElement.lang = en ? 'en' : 'es';
const canvas = document.getElementById('canvas');
canvas.setAttribute('aria-label', en ? 'Pixel art map. Arrow keys or WASD to walk, E to interact, Escape to pause. Tab to leave the map.' : 'Mapa pixel art. Flechas o WASD para caminar, E para interactuar, Escape para pausar. Tab para salir del mapa.');
// Preserve native focus traversal instead of letting the engine consume Tab.
window.addEventListener('keydown', event => { if (event.key === 'Tab') event.stopImmediatePropagation(); }, true);
let receiver;
window.careerBridge = {
  subscribe(callback) { receiver = callback; },
  emit(json) { parent.postMessage({ ...JSON.parse(json), channel }, location.origin); }
};
window.addEventListener('message', event => {
  if (event.origin !== location.origin || event.source !== parent || event.data?.channel !== channel || event.data.type !== 'state') return;
  document.documentElement.lang = event.data.state.locale;
  receiver?.(JSON.stringify(event.data.state));
});
const engine = new Engine($GODOT_CONFIG);
engine.startGame({ canvas, canvasResizePolicy: 2, onPrint: () => {}, onPrintError: console.error }).catch(() => window.careerBridge.emit(JSON.stringify({ type: 'error' })));
</script></body></html>
