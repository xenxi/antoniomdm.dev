<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AntoñiOS · Pixel World</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b101c}canvas{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}canvas:focus-visible{outline:2px solid #b6f2d3;outline-offset:-3px}</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

<script src="index.js"></script><script>
const channel = 'antonios:godot:v1';
const en = new URLSearchParams(location.search).get('lang') === 'en';
const e2eDebug = new URLSearchParams(location.search).get('e2eDebug') === '1';
document.documentElement.lang = en ? 'en' : 'es';
const canvas = document.getElementById('canvas');
canvas.setAttribute('aria-label', en ? 'Pixel art map. Arrow keys or WASD to walk, E to interact, Escape to pause. Tab to leave the map.' : 'Mapa pixel art. Flechas o WASD para caminar, E para interactuar, Escape para pausar. Tab para salir del mapa.');
// Preserve native focus traversal instead of letting the engine consume Tab.
window.addEventListener('keydown', event => { if (event.key === 'Tab') event.stopImmediatePropagation(); }, true);
let receiver;
function debug(stage, detail = {}) {
  if (!e2eDebug) return;
  const rect = canvas.getBoundingClientRect();
  const snapshot = {
    stage,
    canvas: { cssWidth: rect.width, cssHeight: rect.height, width: canvas.width, height: canvas.height },
    viewport: { width: innerWidth, height: innerHeight },
    devicePixelRatio,
    ...detail,
  };
  const previous = window.__CAREER_E2E_DEBUG__ ?? {};
  window.__CAREER_E2E_DEBUG__ = { ...previous, shell: snapshot, events: [...(previous.events ?? []), { source: 'shell', ...snapshot }].slice(-40) };
  parent.postMessage({ channel, type: 'debug', source: 'shell', data: snapshot }, location.origin);
}

  subscribe(callback) { receiver = callback; },
  emit(json) {
    const payload = JSON.parse(json);
    debug('godot-received', { seq: payload.seq, type: payload.type, chapterId: payload.chapterId, payload: payload.type === 'interact' ? { id: payload.id } : undefined });
    parent.postMessage({ ...payload, channel }, location.origin);
    debug('godot-forwarded', { seq: payload.seq, type: payload.type, chapterId: payload.chapterId, payload: payload.type === 'interact' ? { id: payload.id } : undefined });
  },
  e2eDebug() { return e2eDebug; },
};
canvas.addEventListener('pointerdown', event => debug('pointer-received', {
  pointer: { clientX: event.clientX, clientY: event.clientY, offsetX: event.offsetX, offsetY: event.offsetY, pointerType: event.pointerType },
}));
window.addEventListener('message', event => {
  if (event.origin !== location.origin || event.source !== parent || event.data?.channel !== channel || event.data.type !== 'state') return;
  debug('react-state-received', { syncSequence: event.data.state.syncSequence, chapterId: event.data.state.chapterId, player: [event.data.state.x, event.data.state.y], positionOrigin: event.data.state.positionOrigin });
  document.documentElement.lang = event.data.state.locale;
  receiver?.(JSON.stringify(event.data.state));
  debug('react-state-forwarded', { syncSequence: event.data.state.syncSequence, chapterId: event.data.state.chapterId, player: [event.data.state.x, event.data.state.y], positionOrigin: event.data.state.positionOrigin });
});
const engine = new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":28784,"index.wasm":39514754},"focusCanvas":false,"gdextensionLibs":[],"godotPoolSize":4});
// Releasing the Godot main loop on document teardown prevents a closing iframe
// from retaining a WebGL context and its animation frame in automated browsers.
window.addEventListener('pagehide', () => engine.requestQuit(), { once: true });
debug('engine-starting');
engine.startGame({ canvas, canvasResizePolicy: 2, onPrint: () => {}, onPrintError: console.error }).catch(() => window.careerBridge.emit(JSON.stringify({ type: 'error' })));
</script></body></html>
